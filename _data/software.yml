projects:
  - id: 1
    name: "lacuna"
    url: "https://github.com/mooreneural/lacuna"
    status: "maintained"
    description: "Python tool for cryptic binding pocket discovery. Generates conformational ensembles (NMA by default; optional OpenMM implicit-solvent MD and Boltz-2 diffusion sampling), detects pockets in every conformer with either a geometric alpha-sphere detector or a learned surface model, clusters them across the ensemble, and ranks them with a learned model over 23 geometric and ensemble-derived features, with an optional PLM-assisted ranker. Evaluated with a size-robust (Jaccard ≥ 0.25) protocol on four independent datasets. On CryptoBench's designated test fold, the zero-dependency default recovers 56% of cryptic sites in its top five and 66% with the PLM-assisted ranker; pooling the geometric and learned-surface candidates via --detector surface-fusion reaches 74%, lifting coverage from 69% to 86% (paired +16.8 points, 95% CI +11.4 to +22.8). Elsewhere: 73% and 76% on PocketMiner, 45% and 55% on a curated apo/holo set, 87% and 97% on COACH420 general binding sites. CryptoBench follows the dataset's own homology-separated folds, with the ranker's coefficients fitted on the train folds only. Outputs docking-ready Boltz YAML constraints, AutoDock Vina configs, and pseudoatom PDB files with hotspot-centered pocket localization. Ships an MCP server and a Claude skill, so the repository imports directly into Claude Science. MIT licensed; v1.1.0 on PyPI as lacuna-pockets. Paper: doi:10.64898/2026.08.14.744956; accompanying analysis: doi:10.64898/2026.08.11.743381."
    role: "Developer"

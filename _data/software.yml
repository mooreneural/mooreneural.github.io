projects:
  - id: 1
    name: "lacuna"
    url: "https://github.com/mooreneural/lacuna"
    status: "maintained"
    featured: true
    logo:
      webp: "/assets/lacuna/lacuna_logo.webp"
      png: "/assets/lacuna/lacuna_logo.png"
    media:
      mp4: "/assets/lacuna/lacuna_explainer.mp4"
      poster: "/assets/lacuna/lacuna_explainer_poster.webp"
      still: "/assets/lacuna/lacuna_explainer_still.webp"
      background: "#0b0e14"
      width: 900
      height: 1125
      alt: "Animation: TEM-1 beta-lactamase shown as one static structure where a site looks closed, then as an ensemble in which a cryptic pocket opens; Lacuna clusters the pocket across conformers and ranks it."
      caption: "TEM-1 β-lactamase. A cryptic pocket closed in the apo structure (PDB 1JWP) opens along the path to the inhibitor-bound structure (1PZO), and Lacuna finds it across 20 conformers in a retrospective test."
    description: "Python tool for cryptic binding pocket discovery in proteins, RNA and DNA: sites that are absent or too small to detect in the unbound structure and open only as the molecule moves. Generates a conformational ensemble from any input structure (NMA by default; implicit-solvent MD, Boltz-2 diffusion sampling or a user-supplied ensemble as alternatives), detects pockets in every conformer, clusters the detections into persistent sites, and ranks them with a model fitted on within-structure pairs. On CryptoBench's designated test fold, with all 222 structures scored, the zero-dependency default recovers the cryptic site in its top five for 59.9% of structures; it recovers 69% on PocketMiner, 41% on a curated set of literature apo/holo pairs and 89% on the already-open COACH420 set. The fitted ranker is the largest single effect measured: +27.5 points over the analytic rule it replaced (95% CI +21.2 to +33.8). An optional protein-language-model ranker reaches 66.1% on a 180-structure subset of that fold, and pooling the geometric detector with an optional learned surface detector via <code>--detector surface-fusion</code> reaches 73.9% top five, with the site found at all for 86.4% of structures, in a separate held-out evaluation (both measured with v1.4.0). A per-residue cryptic-site propensity reaches AUROC 0.766 and AUPRC 0.340 on the same fold (231 targets), against 0.249 for the same scorer on the input structure alone, so the ensemble carries information the input does not. RNA and DNA need no extra flags; on RNA sites with no cavity in the input, the ensemble raises the fraction found from 44% to 73%. With the default NMA backend the report is identical at any thread count and between Windows and Linux on the 40 proteins compared, and a run takes a median of 1.9 seconds per chain on one CPU thread at the default 20 conformers. Lacuna was also evaluated independently in zPocket (Portnoi et al., 2026, arXiv:2610.17696), winner of the Octavian-Eugen Ganea Prize for Best Paper at MoML 2026, as one of five pocket finders benchmarked on PocketWatch using v1.2.0: re-scoring its ensemble proposals with zPocket's learned ranker nearly doubled top-ranked recovery (DCCN+2 0.209 to 0.399), the detection-versus-ranking gap described in the accompanying analysis. Outputs docking-ready Boltz constraints and AutoDock Vina boxes, a per-residue propensity map, the conformer ensemble as a multi-model PDB, and a flag for pockets at a chain interface. Runs as a local MCP server and a Claude skill, so the repository imports directly into Claude Science, and on hosted no-install platforms. MIT licensed; v1.5.0 on PyPI as lacuna-pockets. Paper: doi:10.64898/2026.08.14.744956; accompanying analysis: doi:10.64898/2026.08.11.743381."
    role: "Developer"

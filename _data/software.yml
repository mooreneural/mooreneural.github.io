      background: "#040608"
      width: 720
      height: 900
      alt: "Animation of the Virtual Cell Challenge task: an unperturbed cell, a CRISPRi knockdown, and a model predicting the response in a cell context it has never seen perturbed."
      caption: "The challenge task: predict a cell's response to a CRISPRi knockdown in a context the model has never seen perturbed."
    description: "My entry in the Arc Institute's 2026 Virtual Cell Challenge, competing as Team Silver Labs. The task is zero-shot: given the unperturbed state of a cell line and a gene knocked down with CRISPRi, predict how thousands of genes respond in cell contexts with no perturbation data, scored against Perturb-seq measurements the model has never seen. The approach is deliberately constrained to one person, one desktop GPU, and only openly licensed data, to test how far a carefully built model can go against systems trained on much larger private datasets. Featured in Arc's 2026 competitor showcase. The code and a record of negative results will be released after the challenge closes."

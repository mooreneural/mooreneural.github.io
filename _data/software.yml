  - id: 2
    name: "vCell"
    status: "competed"
    highlight:
      - "Validation round: rank 213 of 1,457 teams (top 14.6%)"
      - "Final round, scored blind: rank 181 of 806 teams (top 22.5%)"
    featured: true
    media:
      mp4: "/assets/vcell/vcell_zero_shot.mp4"
      poster: "/assets/vcell/vcell_zero_shot_poster.webp"
      still: "/assets/vcell/vcell_zero_shot_still.webp"
      background: "#040608"
      width: 900
      height: 1125
      alt: "Animation of the Virtual Cell Challenge task: an unperturbed cell, a CRISPRi knockdown, and a model predicting the response in a cell context it has never seen perturbed."
      caption: "The challenge task: predict a cell's response to a CRISPRi knockdown in a context the model has never seen perturbed."
    description: "My entry in the Arc Institute's 2026 Virtual Cell Challenge, competing as Team Silver Labs. The task is zero-shot: given the unperturbed state of a cell line and a gene knocked down with CRISPRi, predict how thousands of genes respond in cell contexts with no perturbation data, scored against Perturb-seq measurements the model has never seen. The approach is deliberately constrained to one person, one desktop GPU, and only openly licensed data, to test how far a carefully built model can go against systems trained on much larger private datasets. On the final test set, vCell ranked 181st of 806 teams (top 22.5%) with an overall score of 0.1803. On the validation leaderboard, scored on a 300-perturbation panel across three cell contexts, it ranked 213th of 1,457 teams (top 14.6%) with 0.1996. A lesson in hindsight: the final ranking scores each team's last submission, and I made mine after live scoring had been switched off, so it went in untested. Leaving my best validated model as the last submission would have been the safer choice: had it matched its validation score of 0.1996 on the final set, it would have placed 143rd of 806 (top 17.7%). Featured in Arc's 2026 competitor showcase. The code and a record of negative results will be released after the challenge closes."
    role: "Competitor"

projects:
  - id: 1
    name: "lacuna"
    url: "https://github.com/mooreneural/lacuna"
    status: "maintained"
    featured: true
    logo:
      webp: "/assets/lacuna/lacuna_logo.webp"
      png: "/assets/lacuna/lacuna_logo.png"
    media:
      mp4: "/assets/lacuna/lacuna_explainer.mp4"
      poster: "/assets/lacuna/lacuna_explainer_poster.webp"
      still: "/assets/lacuna/lacuna_explainer_still.webp"
      background: "#0b0e14"
      width: 720
      height: 900
      alt: "Animation: TEM-1 beta-lactamase shown as one static structure where a site looks closed, then as an ensemble in which a cryptic pocket opens; Lacuna clusters the pocket across conformers and ranks it."
      caption: "TEM-1 β-lactamase. A cryptic pocket closed in the apo structure (PDB 1JWP) opens along the path to the inhibitor-bound structure (1PZO), and Lacuna finds it across 20 conformers in a retrospective test."
    description: "Python tool for cryptic binding pocket discovery. Generates conformational ensembles (NMA by default; optional OpenMM implicit-solvent MD and Boltz-2 diffusion sampling), detects pockets in every conformer with either a geometric alpha-sphere detector or a learned surface model, clusters them across the ensemble, and ranks them with a learned model over 23 geometric and ensemble-derived features, with an optional PLM-assisted ranker. Evaluated with a size-robust (Jaccard ≥ 0.25) protocol on four independent datasets. On CryptoBench's designated test fold, the zero-dependency default recovers 56% of cryptic sites in its top five and 66% with the PLM-assisted ranker; pooling the geometric and learned-surface candidates via <code>--detector surface-fusion</code> reaches 74%, lifting coverage from 69% to 86% (paired +16.8 points, 95% CI +11.4 to +22.8). Elsewhere: 73% (default) and 80% (PLM-assisted) on PocketMiner, 45% and 41% on a curated apo/holo set, and 87% on COACH420 general binding sites, rising to 97% with <code>--detector surface-fusion</code>. CryptoBench follows the dataset's own homology-separated folds, with the ranker's coefficients fitted on the train folds only. Outputs docking-ready Boltz YAML constraints, AutoDock Vina configs, pseudoatom PDB files with hotspot-centered pocket localization, and the full conformational ensemble as a multi-model PDB. Ships an MCP server and a Claude skill, so the repository imports directly into Claude Science. MIT licensed; v1.2.0 on PyPI as lacuna-pockets. Paper: doi:10.64898/2026.08.14.744956; accompanying analysis: doi:10.64898/2026.08.11.743381."
    role: "Developer"
    links:
      - name: "Run on Tamarind"
        url: "https://app.tamarind.bio/tools/lacuna"
        icon: "fas fa-server"
      - name: "Run on Neurosnap"
        url: "https://neurosnap.ai/service/Lacuna%20Cryptic%20Pocket%20Discovery"
        icon: "fas fa-server"
